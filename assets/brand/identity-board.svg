<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="992" viewBox="0 0 1280 992" role="img" aria-labelledby="title desc">
<title id="title">Retulo identity study with selected and alternate R monograms</title>
<desc id="desc">The selected symbol has a continuous vertical stem and an open seam before a separate diagonal leg. A squared angular alternative is shown for comparison. The board includes 16, 24, 32, and 48 pixel symbols, a lowercase wordmark, and a dark-background lockup. Selection is a design proposal, not user approval.</desc>
<rect width="1280" height="992" fill="#ffffff"/>
<text x="48" y="64" fill="#000000" font-family="Inter,Arial,Helvetica,sans-serif" font-size="24" font-weight="650" text-anchor="start" letter-spacing="2">RETULO / IDENTITY STUDY</text><path d="M48 92H1232" fill="none" stroke="#000000" stroke-width="2"/><text x="48" y="148" fill="#000000" font-family="Inter,Arial,Helvetica,sans-serif" font-size="28" font-weight="600" text-anchor="start">01 / Selected</text><g transform="translate(48 180) scale(4.0)"><path d="M10 8H34C47 8 54 14 54 25C54 36 47 42 34 42H23V56H10V8ZM23 20V30H34C39 30 41 28 41 25C41 22 39 20 34 20H23Z" fill="#000000" fill-rule="evenodd"/><path d="M33 46H47L57 56H42Z" fill="#1f4dff"/></g><g transform="translate(388 244) scale(2.0)"><path d="M10 8H34C47 8 54 14 54 25C54 36 47 42 34 42H23V56H10V8ZM23 20V30H34C39 30 41 28 41 25C41 22 39 20 34 20H23Z" fill="#000000" fill-rule="evenodd"/><path d="M33 46H47L57 56H42Z" fill="#1f4dff"/></g><text x="532.64" y="348.96" fill="#000000" font-family="Inter,Arial,Helvetica,sans-serif" font-size="110.08" font-weight="650" text-anchor="start" letter-spacing="-4.096">retulo</text><text x="388" y="420" fill="#000000" font-family="Inter,Arial,Helvetica,sans-serif" font-size="30" font-weight="500" text-anchor="start">A steady stem. A distinct next step.</text><text x="48" y="514" fill="#000000" font-family="Inter,Arial,Helvetica,sans-serif" font-size="28" font-weight="600" text-anchor="start">02 / Angular alternative</text><g transform="translate(48 544) scale(2.0)"><path d="M10 8H40L54 22V32L44 42H23V56H10V8ZM23 20V30H35L41 24L37 20H23Z" fill="#000000" fill-rule="evenodd"/><path d="M33 46H47L57 56H42Z" fill="#1f4dff"/></g><text x="220" y="608" fill="#000000" font-family="Inter,Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start">More industrial; less clear at small sizes.</text><path d="M48 720H1232" fill="none" stroke="#000000" stroke-width="2"/><text x="48" y="772" fill="#000000" font-family="Inter,Arial,Helvetica,sans-serif" font-size="28" font-weight="600" text-anchor="start">Small sizes / 16 · 24 · 32 · 48</text><g transform="translate(48 808) scale(0.25)"><path d="M10 8H34C47 8 54 14 54 25C54 36 47 42 34 42H23V56H10V8ZM23 20V30H34C39 30 41 28 41 25C41 22 39 20 34 20H23Z" fill="#000000" fill-rule="evenodd"/><path d="M33 46H47L57 56H42Z" fill="#1f4dff"/></g><g transform="translate(116 808) scale(0.375)"><path d="M10 8H34C47 8 54 14 54 25C54 36 47 42 34 42H23V56H10V8ZM23 20V30H34C39 30 41 28 41 25C41 22 39 20 34 20H23Z" fill="#000000" fill-rule="evenodd"/><path d="M33 46H47L57 56H42Z" fill="#1f4dff"/></g><g transform="translate(192 808) scale(0.5)"><path d="M10 8H34C47 8 54 14 54 25C54 36 47 42 34 42H23V56H10V8ZM23 20V30H34C39 30 41 28 41 25C41 22 39 20 34 20H23Z" fill="#000000" fill-rule="evenodd"/><path d="M33 46H47L57 56H42Z" fill="#1f4dff"/></g><g transform="translate(280 808) scale(0.75)"><path d="M10 8H34C47 8 54 14 54 25C54 36 47 42 34 42H23V56H10V8ZM23 20V30H34C39 30 41 28 41 25C41 22 39 20 34 20H23Z" fill="#000000" fill-rule="evenodd"/><path d="M33 46H47L57 56H42Z" fill="#1f4dff"/></g><rect x="672" y="752" width="560" height="192" fill="#000000"/><g transform="translate(708 792) scale(1.75)"><path d="M10 8H34C47 8 54 14 54 25C54 36 47 42 34 42H23V56H10V8ZM23 20V30H34C39 30 41 28 41 25C41 22 39 20 34 20H23Z" fill="#ffffff" fill-rule="evenodd"/><path d="M33 46H47L57 56H42Z" fill="#1f4dff"/></g><text x="834.56" y="883.84" fill="#ffffff" font-family="Inter,Arial,Helvetica,sans-serif" font-size="96.32" font-weight="650" text-anchor="start" letter-spacing="-3.584">retulo</text><text x="48" y="932" fill="#000000" font-family="Inter,Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start">Original SVG geometry / black, white, cobalt</text>
