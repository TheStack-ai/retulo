<svg xmlns="http://www.w3.org/2000/svg" width="960" height="632" viewBox="0 0 960 632" role="img" aria-labelledby="title desc">
<title id="title">Continue the same Retulo task across conversations</title>
<desc id="desc">An ordinary file request is handled by the host agent using Retulo and a task workspace. In a later chat, identify that task using its ID, workspace path, or artifact reference; the agent reads recorded state and continues while retaining previous outputs. This is a workflow illustration, not a product user interface.</desc>
<rect width="960" height="632" fill="#ffffff"/>
<text x="40" y="56" fill="#000000" font-family="Inter,Arial,Helvetica,sans-serif" font-size="40" font-weight="650" text-anchor="start" letter-spacing="-1.4">One task. Ready for the next conversation.</text><text x="40" y="100" fill="#000000" font-family="Inter,Arial,Helvetica,sans-serif" font-size="26" font-weight="400" text-anchor="start">Workflow illustration</text><rect x="40" y="148" width="264" height="108" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="60" y="186" fill="#000000" font-family="Inter,Arial,Helvetica,sans-serif" font-size="30" font-weight="600" text-anchor="start">A file request</text><text x="60" y="220" fill="#000000" font-family="Inter,Arial,Helvetica,sans-serif" font-size="26" font-weight="400" text-anchor="start">Create or revise</text><rect x="348" y="148" width="264" height="108" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="368" y="186" fill="#000000" font-family="Inter,Arial,Helvetica,sans-serif" font-size="30" font-weight="600" text-anchor="start">Your agent</text><text x="368" y="220" fill="#000000" font-family="Inter,Arial,Helvetica,sans-serif" font-size="26" font-weight="400" text-anchor="start">Uses Retulo</text><rect x="656" y="148" width="264" height="108" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="676" y="186" fill="#000000" font-family="Inter,Arial,Helvetica,sans-serif" font-size="30" font-weight="600" text-anchor="start">Task workspace</text><text x="676" y="220" fill="#000000" font-family="Inter,Arial,Helvetica,sans-serif" font-size="26" font-weight="400" text-anchor="start">Files + records</text><path d="M304 202L348 202 M339 196L348 202L339 208" fill="none" stroke="#000000" stroke-width="2" stroke-linejoin="miter"/><path d="M612 202L656 202 M647 196L656 202L647 208" fill="none" stroke="#000000" stroke-width="2" stroke-linejoin="miter"/><rect x="40" y="364" width="264" height="108" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="60" y="402" fill="#000000" font-family="Inter,Arial,Helvetica,sans-serif" font-size="30" font-weight="600" text-anchor="start">A new chat</text><text x="60" y="436" fill="#000000" font-family="Inter,Arial,Helvetica,sans-serif" font-size="26" font-weight="400" text-anchor="start">Identify the task</text><rect x="348" y="364" width="264" height="108" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="368" y="402" fill="#000000" font-family="Inter,Arial,Helvetica,sans-serif" font-size="30" font-weight="600" text-anchor="start">Recorded state</text><text x="368" y="436" fill="#000000" font-family="Inter,Arial,Helvetica,sans-serif" font-size="26" font-weight="400" text-anchor="start">Read what remains</text><rect x="656" y="364" width="264" height="108" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="676" y="402" fill="#000000" font-family="Inter,Arial,Helvetica,sans-serif" font-size="30" font-weight="600" text-anchor="start">Continue work</text><text x="676" y="436" fill="#000000" font-family="Inter,Arial,Helvetica,sans-serif" font-size="26" font-weight="400" text-anchor="start">Keep prior results</text><path d="M304 418L348 418 M339 412L348 418L339 424" fill="none" stroke="#000000" stroke-width="2" stroke-linejoin="miter"/><path d="M612 418L656 418 M647 412L656 418L647 424" fill="none" stroke="#000000" stroke-width="2" stroke-linejoin="miter"/><path d="M788 256L788 304L480 304L480 364 M474 355L480 364L486 355" fill="none" stroke="#1f4dff" stroke-width="2" stroke-linejoin="miter"/><text x="40" y="544" fill="#000000" font-family="Inter,Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start">Use the same task ID, workspace path, or artifact reference.</text><text x="40" y="598" fill="#000000" font-family="Inter,Arial,Helvetica,sans-serif" font-size="28" font-weight="500" text-anchor="start">Retulo manages the workspace. Your agent runs the tools.</text>
</svg>
