<svg xmlns="http://www.w3.org/2000/svg" width="960" height="736" viewBox="0 0 960 736" role="img" aria-labelledby="title desc">
<title id="title">Retulo&#x27;s declared workflow updates five affected steps and reuses one independent step</title>
<desc id="desc">In the verified repository-inventory example, updated input caused aggregate, chart, summary, report, and validate steps to rebuild. An independent profile step was reused. Previous final outputs remained preserved. Arrows show declared dependencies; the host agent runs production tools. This is a workflow illustration, not a user interface.</desc>
<rect width="960" height="736" fill="#ffffff"/>
<text x="40" y="56" fill="#000000" font-family="Inter,Arial,Helvetica,sans-serif" font-size="40" font-weight="650" text-anchor="start" letter-spacing="-1.4">Update the work that depends on a change.</text><text x="40" y="100" fill="#000000" font-family="Inter,Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start">Workflow illustration / 5 rebuilt · 1 reused</text><rect x="40" y="144" width="240" height="96" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="60" y="182" fill="#000000" font-family="Inter,Arial,Helvetica,sans-serif" font-size="30" font-weight="600" text-anchor="start">Updated input</text><text x="60" y="216" fill="#000000" font-family="Inter,Arial,Helvetica,sans-serif" font-size="26" font-weight="400" text-anchor="start">Declared source</text><rect x="340" y="144" width="240" height="96" fill="#ffffff" stroke="#1f4dff" stroke-width="2"/><rect x="340" y="144" width="8" height="8" fill="#1f4dff"/><text x="360" y="182" fill="#1f4dff" font-family="Inter,Arial,Helvetica,sans-serif" font-size="30" font-weight="600" text-anchor="start">Aggregate</text><text x="360" y="216" fill="#1f4dff" font-family="Inter,Arial,Helvetica,sans-serif" font-size="26" font-weight="400" text-anchor="start">Rebuilt</text><rect x="660" y="144" width="260" height="96" fill="#ffffff" stroke="#1f4dff" stroke-width="2"/><rect x="660" y="144" width="8" height="8" fill="#1f4dff"/><text x="680" y="182" fill="#1f4dff" font-family="Inter,Arial,Helvetica,sans-serif" font-size="30" font-weight="600" text-anchor="start">Chart</text><text x="680" y="216" fill="#1f4dff" font-family="Inter,Arial,Helvetica,sans-serif" font-size="26" font-weight="400" text-anchor="start">Rebuilt</text><rect x="340" y="320" width="240" height="96" fill="#ffffff" stroke="#1f4dff" stroke-width="2"/><rect x="340" y="320" width="8" height="8" fill="#1f4dff"/><text x="360" y="358" fill="#1f4dff" font-family="Inter,Arial,Helvetica,sans-serif" font-size="30" font-weight="600" text-anchor="start">Summary</text><text x="360" y="392" fill="#1f4dff" font-family="Inter,Arial,Helvetica,sans-serif" font-size="26" font-weight="400" text-anchor="start">Rebuilt</text><rect x="660" y="320" width="260" height="96" fill="#ffffff" stroke="#1f4dff" stroke-width="2"/><rect x="660" y="320" width="8" height="8" fill="#1f4dff"/><text x="680" y="358" fill="#1f4dff" font-family="Inter,Arial,Helvetica,sans-serif" font-size="30" font-weight="600" text-anchor="start">Report</text><text x="680" y="392" fill="#1f4dff" font-family="Inter,Arial,Helvetica,sans-serif" font-size="26" font-weight="400" text-anchor="start">Rebuilt</text><rect x="40" y="496" width="240" height="96" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="60" y="534" fill="#000000" font-family="Inter,Arial,Helvetica,sans-serif" font-size="30" font-weight="600" text-anchor="start">Profile</text><text x="60" y="568" fill="#000000" font-family="Inter,Arial,Helvetica,sans-serif" font-size="26" font-weight="400" text-anchor="start">Reused</text><rect x="660" y="496" width="260" height="96" fill="#ffffff" stroke="#1f4dff" stroke-width="2"/><rect x="660" y="496" width="8" height="8" fill="#1f4dff"/><text x="680" y="534" fill="#1f4dff" font-family="Inter,Arial,Helvetica,sans-serif" font-size="30" font-weight="600" text-anchor="start">Validate</text><text x="680" y="568" fill="#1f4dff" font-family="Inter,Arial,Helvetica,sans-serif" font-size="26" font-weight="400" text-anchor="start">Rebuilt</text><path d="M280 192L340 192 M331 186L340 192L331 198" fill="none" stroke="#1f4dff" stroke-width="2" stroke-linejoin="miter"/><path d="M580 192L660 192 M651 186L660 192L651 198" fill="none" stroke="#1f4dff" stroke-width="2" stroke-linejoin="miter"/><path d="M460 240L460 320 M454 311L460 320L466 311" fill="none" stroke="#1f4dff" stroke-width="2" stroke-linejoin="miter"/><path d="M580 368L660 368 M651 362L660 368L651 374" fill="none" stroke="#1f4dff" stroke-width="2" stroke-linejoin="miter"/><path d="M790 240L790 320 M7