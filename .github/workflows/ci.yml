name: Release checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked runtime and build frontend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock -r requirements-build.lock
      - name: Install source package
        run: .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Run synthetic regression and wire tests
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Exercise isolated install, lifecycle and restore
        run: .venv/bin/python scripts/smoke_local.py
      - name: Inspect public source
        run: .venv/bin/python scripts/check_release.py
      - name: Build source distribution and wheel
        run: .venv/bin/python -m build --no-isolation
      - name: Inspect distribution contents
        run: .venv/bin/python scripts/check_release.py --artifacts-dir dist
      - name: Exercise installed wheel without checkout dependencies
        run: .venv/bin/python scripts/smoke_package.py --wheel dist/retulo-0.5.0rc1-py3-none-any.whl
      - name: Exercise persistent bootstrap and reinstall
        if: matrix.python-version == '3.11'
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/retulo-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/retulo-tool-bin
          UV_CACHE_DIR: ${{ runner.temp }}/retulo-uv-cache
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/retulo-python
          XDG_DATA_HOME: ${{ runner.temp }}/retulo-data
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import hashlib
          wheel = Path('dist/retulo-0.5.0rc1-py3-none-any.whl')
          Path('dist/SHA256SUMS').write_text(hashlib.sha256(wheel.read_bytes()).hexdigest() + '  ' + wheel.name + '\n')
          PY
          sh install.sh --asset-dir "$PWD/dist"
          sh install.sh --asset-dir "$PWD/dist"
          "$UV_TOOL_BIN_DIR/retulo" --version
