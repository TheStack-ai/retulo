name: Release checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked runtime and build frontend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock -r requirements-build.lock
      - name: Install source package
        run: .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Run synthetic regression and wire tests
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Exercise isolated install, lifecycle and restore
        run: .venv/bin/python scripts/smoke_local.py
      - name: Inspect public source
        run: .venv/bin/python scripts/check_release.py
      - name: Build source distribution and wheel
        run: .venv/bin/python -m build --no-isolation
      - name: Inspect distribution contents
        run: .venv/bin/python scripts/check_release.py --artifacts-dir dist
